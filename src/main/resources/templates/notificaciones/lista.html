<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><h1 class="h3">Notificaciones</h1><div class="list-group mt-3"><div class="list-group-item" th:each="n : ${notificaciones}" th:classappend="${!n.leida} ? ' list-group-item-info' : ''"><div class="d-flex justify-content-between"><p class="mb-1" th:text="${n.mensaje}"></p><small th:text="${#temporals.format(n.fechaEnvio,'dd/MM/yyyy HH:mm')}"></small></div><form th:if="${!n.leida}" th:action="@{'/notificaciones/' + ${n.id} + '/leer'}" method="post"><button class="btn btn-sm btn-outline-primary">Marcar como leída</button></form></div></div><p class="text-muted mt-3" th:if="${#lists.isEmpty(notificaciones)}">No tienes notificaciones.</p></main></body></html>
