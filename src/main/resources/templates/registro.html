<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro | AlDía Poli</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm p-4">
            <h1 class="h3">Crear cuenta</h1>
            <div
              th:if="${error}"
              class="alert alert-danger"
              th:text="${error}"
            ></div>
            <form
              th:action="@{/registro}"
              th:object="${registro}"
              method="post"
            >
              <label class="form-label">Nombre</label
              ><input
                class="form-control mb-2"
                th:field="*{nombre}"
                required
              /><label class="form-label">Correo</label
              ><input
                class="form-control mb-2"
                type="email"
                th:field="*{correo}"
                required
              /><label class="form-label">Contraseña</label
              ><input
                class="form-control mb-2"
                type="password"
                th:field="*{clave}"
                required
                minlength="6"
              /><label class="form-label">Programa académico</label
              ><input
                class="form-control mb-2"
                th:field="*{programaAcademico}"
                required
              /><label class="form-label">Sede</label
              ><input class="form-control mb-3" th:field="*{sede}" /><button
                class="btn btn-primary"
              >
                Registrarme</button
              ><a class="btn btn-link" th:href="@{/login}">Volver</a>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
