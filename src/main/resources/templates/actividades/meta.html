<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meta académica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="container">
      <div class="card card-body shadow-sm">
        <h1 class="h3">Meta académica</h1>
        <p>Materia: <strong th:text="${materia.nombre}"></strong></p>
        <p>Meta deseada: <strong th:text="${meta}"></strong></p>
        <div th:if="${necesaria <= 0}" class="alert alert-success">
          La meta ya está asegurada con el acumulado actual.
        </div>
        <div
          th:if="${necesaria > 0 and necesaria <= 5}"
          class="alert alert-info"
        >
          Necesitas un promedio aproximado de
          <strong th:text="${#numbers.formatDecimal(necesaria,1,2)}"></strong>
          en el porcentaje restante.
        </div>
        <div th:if="${necesaria > 5}" class="alert alert-danger">
          Con las actividades restantes no es posible alcanzar esa meta
          (requerirías más de 5.0).
        </div>
        <a class="btn btn-primary" th:href="@{'/materias/' + ${materia.id}}"
          >Volver</a
        >
      </div>
    </main>
  </body>
</html>
