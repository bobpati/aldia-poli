<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nueva actividad</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <h1 class="h3">Nueva actividad</h1>
          <p class="text-muted" th:text="${materia.nombre}"></p>
          <div
            th:if="${error}"
            class="alert alert-danger"
            th:text="${error}"
          ></div>
          <form
            th:action="@{/actividades(materiaId=${materia.id})}"
            th:object="${actividad}"
            method="post"
            class="card card-body shadow-sm"
          >
            <label class="form-label">Nombre</label
            ><input
              class="form-control mb-3"
              th:field="*{nombre}"
              required
            /><label class="form-label">Tipo</label
            ><select class="form-select mb-3" th:field="*{tipo}" required>
              <option
                th:each="t : ${tipos}"
                th:value="${t}"
                th:text="${t}"
              ></option></select
            ><label class="form-label">Porcentaje</label
            ><input
              class="form-control mb-3"
              type="number"
              min="0.01"
              max="100"
              step="0.01"
              th:field="*{porcentaje}"
              required
            /><label class="form-label">Fecha de entrega</label
            ><input
              class="form-control mb-3"
              type="date"
              th:field="*{fechaEntrega}"
              required
            /><button class="btn btn-primary">Guardar actividad</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
