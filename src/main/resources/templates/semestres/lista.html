<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Semestres</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="container">
      <div class="d-flex justify-content-between">
        <h1 class="h3">Semestres</h1>
        <a class="btn btn-primary" th:href="@{/semestres/nuevo}">+ Semestre</a>
      </div>
      <div class="table-responsive mt-3">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Periodo</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="s : ${semestres}">
              <td th:text="${s.periodo}"></td>
              <td th:text="${s.fechaInicio}"></td>
              <td th:text="${s.fechaFin}"></td>
              <td>
                <span
                  class="badge text-bg-secondary"
                  th:text="${s.estado}"
                ></span>
              </td>
              <td class="text-end">
                <form
                  th:action="@{'/semestres/' + ${s.id} + '/eliminar'}"
                  method="post"
                  onsubmit="return confirm('¿Eliminar semestre y sus datos?');"
                >
                  <button class="btn btn-sm btn-outline-danger">
                    Eliminar
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
