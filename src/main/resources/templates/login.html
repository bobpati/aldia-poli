<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ingreso | AlDía Poli</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="auth-bg">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm p-4">
            <h1 class="h3 fw-bold">AlDía Poli</h1>
            <p class="text-muted">Tu seguimiento académico en un solo lugar.</p>
            <div th:if="${param.error}" class="alert alert-danger">
              Correo o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
              Sesión cerrada.
            </div>
            <div th:if="${param.registrado}" class="alert alert-success">
              Cuenta creada. Ya puedes ingresar.
            </div>
            <form th:action="@{/login}" method="post">
              <label class="form-label">Correo</label
              ><input
                class="form-control mb-3"
                type="email"
                name="correo"
                required
              /><label class="form-label">Contraseña</label
              ><input
                class="form-control mb-3"
                type="password"
                name="clave"
                required
              /><button class="btn btn-primary w-100">Ingresar</button>
            </form>
            <a class="btn btn-link mt-2" th:href="@{/registro}">Crear cuenta</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
