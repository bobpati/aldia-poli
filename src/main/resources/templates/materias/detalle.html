<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${materia.nombre}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="d-flex justify-content-between align-items-start"><div><h1 class="h3" th:text="${materia.nombre}"></h1><p class="text-muted" th:text="${materia.codigo + ' · ' + materia.creditos + ' créditos · ' + materia.semestre.periodo}"></p></div><a class="btn btn-primary" th:href="@{/actividades/nueva(materiaId=${materia.id})}">+ Actividad</a></div><div class="row g-3 mb-4"><div class="col-md-4"><div class="card card-body"><small>Promedio actual</small><strong class="fs-3" th:text="${#numbers.formatDecimal(promedio,1,2)}"></strong></div></div><div class="col-md-4"><div class="card card-body"><small>Acumulado definitivo</small><strong class="fs-3" th:text="${#numbers.formatDecimal(acumulado,1,2)}"></strong></div></div><div class="col-md-4"><div class="card card-body"><small>Porcentaje evaluado</small><strong class="fs-3" th:text="${#numbers.formatDecimal(evaluado,1,1) + '%'}"></strong></div></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Actividad</th><th>Tipo</th><th>%</th><th>Entrega</th><th>Nota</th><th>Acción</th></tr></thead><tbody><tr th:each="a : ${materia.actividades}"><td th:text="${a.nombre}"></td><td th:text="${a.tipo}"></td><td th:text="${a.porcentaje}"></td><td th:text="${a.fechaEntrega}"></td><td><span th:if="${a.calificacion != null}" th:text="${a.calificacion.valor}"></span><span th:if="${a.calificacion == null}" class="text-muted">Pendiente</span></td><td><form class="d-flex gap-2" th:action="@{'/actividades/' + ${a.id} + '/calificacion'}" method="post"><input class="form-control form-control-sm" style="max-width:90px" type="number" name="valor" min="0" max="5" step="0.01" placeholder="0-5" required><input class="form-control form-control-sm" name="observacion" placeholder="Observación"><button class="btn btn-sm btn-success">Guardar nota</button></form></td></tr></tbody></table></div><div class="card card-body mt-4"><h2 class="h5">Meta académica</h2><form class="row g-2" th:action="@{'/materias/' + ${materia.id} + '/meta'}" method="get"><div class="col-sm-4"><input class="form-control" type="number" name="meta" min="0" max="5" step="0.1" value="3.0"></div><div class="col-sm-4"><button class="btn btn-outline-primary">Calcular nota necesaria</button></div></form><small class="text-muted mt-2">La meta se calcula sobre el porcentaje aún no evaluado.</small></div></main></body></html>
