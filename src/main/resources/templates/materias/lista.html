<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Materias</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="container">
      <div class="d-flex justify-content-between">
        <h1 class="h3">Materias</h1>
        <a class="btn btn-primary" th:href="@{/materias/nueva}">+ Materia</a>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-md-6" th:each="m : ${materias}">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5" th:text="${m.nombre}"></h2>
              <p
                class="text-muted mb-2"
                th:text="${m.codigo + ' · ' + m.creditos + ' créditos · ' + m.semestre.periodo}"
              ></p>
              <p>
                Promedio actual:
                <strong
                  th:text="${#numbers.formatDecimal(calculo.promedioActual(m),1,2)}"
                ></strong>
              </p>
              <a
                class="btn btn-outline-primary btn-sm"
                th:href="@{'/materias/' + ${m.id}}"
                >Abrir</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
