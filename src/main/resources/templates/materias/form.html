<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nueva materia</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <h1 class="h3">Nueva materia</h1>
          <div th:if="${#lists.isEmpty(semestres)}" class="alert alert-warning">
            Primero debes crear un semestre.
          </div>
          <form
            th:unless="${#lists.isEmpty(semestres)}"
            th:action="@{/materias}"
            th:object="${materia}"
            method="post"
            class="card card-body shadow-sm"
          >
            <label class="form-label">Nombre</label
            ><input
              class="form-control mb-3"
              th:field="*{nombre}"
              required
            /><label class="form-label">Código</label
            ><input
              class="form-control mb-3"
              th:field="*{codigo}"
              required
            /><label class="form-label">Créditos</label
            ><input
              class="form-control mb-3"
              type="number"
              min="1"
              th:field="*{creditos}"
              required
            /><label class="form-label">Semestre</label
            ><select class="form-select mb-3" name="semestreId" required>
              <option
                th:each="s : ${semestres}"
                th:value="${s.id}"
                th:text="${s.periodo}"
              ></option></select
            ><button class="btn btn-primary">Guardar</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
