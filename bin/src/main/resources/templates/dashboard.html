<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AlDía Poli</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-0">Estado académico</h1><small class="text-muted">Resumen de tus materias y próximas actividades</small></div><a class="btn btn-primary" th:href="@{/materias/nueva}">+ Materia</a></div><div class="alert alert-info" th:if="${noLeidas > 0}">Tienes <strong th:text="${noLeidas}"></strong> notificaciones sin leer. <a th:href="@{/notificaciones}">Ver</a></div><div class="row g-3"><div class="col-md-4" th:each="m : ${materias}"><div class="card h-100 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><h2 class="h5" th:text="${m.nombre}"></h2><span class="badge text-bg-secondary" th:text="${m.creditos + ' cr'}"></span></div><p class="display-6 mb-1" th:text="${#numbers.formatDecimal(promedios[m.id],1,2)}"></p><span th:if="${promedios[m.id] < 3.0}" class="badge text-bg-danger">En riesgo</span><span th:unless="${promedios[m.id] < 3.0}" class="badge text-bg-success">Estable</span><div class="mt-3"><a class="btn btn-sm btn-outline-primary" th:href="@{'/materias/' + ${m.id}}">Ver materia</a></div></div></div></div></div><hr class="my-4"><h2 class="h4">Próximos 7 días</h2><div class="list-group" th:if="${!#lists.isEmpty(proximas)}"><a class="list-group-item list-group-item-action" th:each="a : ${proximas}" th:href="@{'/materias/' + ${a.materia.id}}"><strong th:text="${a.nombre}"></strong> · <span th:text="${a.materia.nombre}"></span><span class="float-end" th:text="${a.fechaEntrega}"></span></a></div><p class="text-muted" th:if="${#lists.isEmpty(proximas)}">No tienes actividades próximas.</p></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
